name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor (node:sqlite landed there); 24 is what most people run.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The integration suite spawns the built server over stdio and crawls
      # example.com, so it needs both the build above and network access.
      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=moderate

      # Install the tarball into an empty project rather than extracting it in
      # place: the tarball ships no node_modules, so a bare `node dist/cli.js`
      # inside the extract dies on ERR_MODULE_NOT_FOUND for zod. Installing is
      # also what a user actually does, and it exercises the bin links.
      - name: Verify the published package installs and runs
        run: |
          npm pack --silent
          TARBALL="$PWD/$(ls seo-agent-*.tgz)"
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install --silent "$TARBALL"
          test -x node_modules/.bin/seo-agent
          test -x node_modules/.bin/seo-agent-mcp
          # Smoke-test the shipped entry point against a real site with a
          # scrubbed environment: no keys, and spend frozen at zero.
          env -i PATH="$PATH" HOME="$HOME" \
            SEO_AGENT_DATA_DIR=/tmp/install-check/data SEO_AGENT_BUDGET=0 \
            ./node_modules/.bin/seo-agent seo_crawl_site \
              --url https://example.com --max_pages 2 --quiet
