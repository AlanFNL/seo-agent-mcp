name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor (node:sqlite landed there); 24 is what most people run.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The integration suite spawns the built server over stdio and crawls
      # example.com, so it needs both the build above and network access.
      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Verify the packed tarball is runnable
        run: |
          npm pack --silent
          mkdir -p /tmp/install-check && tar -xzf seo-agent-*.tgz -C /tmp/install-check
          cd /tmp/install-check/package
          # Smoke-test the shipped entry points against a real site, with no keys set.
          env -i PATH="$PATH" HOME="$HOME" SEO_AGENT_DATA_DIR=/tmp/packcheck \
            node dist/cli.js seo_crawl_site --url https://example.com --max_pages 2 --quiet
